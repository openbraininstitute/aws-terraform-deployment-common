name: Auto - Verify & plan production

env:
  AWS_ROLE_ARN_PRODUCTION: arn:aws:iam::671250183987:role/GithubTerraformDeployCommon

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  terraform_verify:
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      #TF_VAR_azure_vpn_gateway_tunnel1_preshared_key1: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY1 }}
      #TF_VAR_azure_vpn_gateway_tunnel1_preshared_key2: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY2 }}
      #TF_VAR_azure_vpn_gateway_tunnel1_ip_address: ${{ secrets.AZURE_VPN_GATEWAY_TUNNEL1_IP_ADDRESS }}
      TF_VAR_azure_vpn_gateway_tunnel2_preshared_key1: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY3 }}
      TF_VAR_azure_vpn_gateway_tunnel2_preshared_key2: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY4 }}
      TF_VAR_azure_vpn_gateway_tunnel2_ip_address: ${{ secrets.AZURE_VPN_GATEWAY_TUNNEL2_IP_ADDRESS }}

    runs-on: ubuntu-latest
    name: Auto Verify & plan terraform code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: us-east-1

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform
        run: terraform init -backend-config="./production.config"

      - name: Run Terraform Plan
        run: |
          terraform plan -input=false -var-file="production.tfvars" -out plan.tfplan >/dev/null && terraform show plan.tfplan
