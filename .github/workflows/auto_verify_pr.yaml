name: Auto - Verify & plan branch environment

env:
  AWS_ROLE_ARN_STAGING: arn:aws:iam::992382665735:role/GithubTerraformDeployCommon

on:
  workflow_dispatch:
  pull_request:
    branches:
      - staging

permissions:
  pull-requests: write

jobs:
  terraform_verify:
    environment: ${{ github.base_ref }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      #TF_VAR_azure_vpn_gateway_tunnel1_preshared_key1: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY1 }}
      #TF_VAR_azure_vpn_gateway_tunnel1_preshared_key2: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY2 }}
      #TF_VAR_azure_vpn_gateway_tunnel1_ip_address: ${{ secrets.AZURE_VPN_GATEWAY_TUNNEL1_IP_ADDRESS }}
      TF_VAR_azure_vpn_gateway_tunnel2_preshared_key1: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY3 }}
      TF_VAR_azure_vpn_gateway_tunnel2_preshared_key2: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY4 }}
      TF_VAR_azure_vpn_gateway_tunnel2_ip_address: ${{ secrets.AZURE_VPN_GATEWAY_TUNNEL2_IP_ADDRESS }}

    runs-on: ubuntu-latest
    name: Auto Verify & plan terraform code for branch environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform
        run: terraform init -backend-config="./${{ github.base_ref }}.config"

      - name: Run Terraform Plan
        run: |
          terraform plan -input=false -var-file="${{ github.base_ref }}.tfvars" -out plan.tfplan >/dev/null
          terraform show plan.tfplan
          terraform show -no-color -json plan.tfplan > tfplan.json

      - name: Run Terraform Change Pull Request Commenter Action
        uses: liatrio/terraform-change-pr-commenter@v1.7.1
        with:
          json-file: 'tfplan.json'
          expand-comment: 'true'
          include-workflow-link: 'true'
