name: Manual - Apply changes
on:
  workflow_dispatch:

jobs:
  terraform_deployment:
    environment: ${{ github.ref_name }} # secrets are set per environment
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    runs-on: ubuntu-latest
    name: Manual terraform apply
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform
        run: terraform init -backend-config="./${{ github.ref_name }}.config" # use branch name as deployment environment

      - name: Run Terraform Plan
        run: |
          terraform plan -var-file="${{ github.ref_name }}.tfvars"

      - name: Run Terraform Apply
        run: |
          terraform apply -auto-approve -var-file="${{ github.ref_name }}.tfvars"
