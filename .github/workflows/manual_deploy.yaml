name: Manual - Apply changes

env:
  AWS_ROLE_ARN_STAGING: arn:aws:iam::992382665735:role/GithubTerraformDeployCommon
  AWS_ROLE_ARN_PRODUCTION: arn:aws:iam::671250183987:role/GithubTerraformDeployCommon

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Which environment to deploy to
        required: true
        default: staging
        options:
          - staging
          - production

jobs:
  terraform_deployment:
    environment: ${{ inputs.environment }} # secrets are set per environment
    permissions:
      id-token: write
      contents: read
    env:
      #TF_VAR_azure_vpn_gateway_tunnel1_preshared_key1: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY1 }}
      #TF_VAR_azure_vpn_gateway_tunnel1_preshared_key2: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY2 }}
      #TF_VAR_azure_vpn_gateway_tunnel1_ip_address: ${{ secrets.AZURE_VPN_GATEWAY_TUNNEL1_IP_ADDRESS }}
      TF_VAR_azure_vpn_gateway_tunnel2_preshared_key1: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY3 }}
      TF_VAR_azure_vpn_gateway_tunnel2_preshared_key2: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY4 }}
      TF_VAR_azure_vpn_gateway_tunnel2_ip_address: ${{ secrets.AZURE_VPN_GATEWAY_TUNNEL2_IP_ADDRESS }}

    runs-on: ubuntu-latest
    name: Manual terraform apply
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.environment == 'production' && env.AWS_ROLE_ARN_PRODUCTION || env.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform
        run: terraform init -backend-config="./${{ inputs.environment }}.config" # use branch name as deployment environment

      - name: Run Terraform Plan
        run: |
          terraform plan -input=false -var-file="${{ inputs.environment }}.tfvars" -out plan.tfplan >/dev/null && terraform show plan.tfplan

      - name: Run Terraform Apply
        run: |
          terraform apply -input=false -auto-approve -var-file="${{ inputs.environment }}.tfvars"
